<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>{% block title %}Hatch{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --line: #8883; --muted: #8a8a8a; --ok: #1a7f37; --bad: #b42318; --warn: #9a6700; --accent: #6d5dfc; --bar: 60px; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font: 16px/1.5 system-ui, -apple-system, sans-serif; margin: 0; padding-bottom: calc(var(--bar) + env(safe-area-inset-bottom) + 16px); }
    main { max-width: 680px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin: 4px 0 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    h2 { font-size: 13px; margin: 26px 0 8px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
    a { color: var(--accent); text-decoration: none; }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: 12px; }
    code, pre { font: 13px/1.45 ui-monospace, monospace; }
    pre { white-space: pre-wrap; margin: 0; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .tag { display: inline-block; padding: 1px 9px; border-radius: 10px; border: 1px solid var(--line); font-size: 12px; font-weight: 500; white-space: nowrap; }
    .tag.approve, .tag.pass, .tag.good { color: var(--ok); border-color: var(--ok); }
    .tag.reject, .tag.fail { color: var(--bad); border-color: var(--bad); }
    .tag.escalate, .tag.flag { color: var(--warn); border-color: var(--warn); }
    .warn { color: var(--warn); } .bad { color: var(--bad); } .good { color: var(--ok); }
    video { width: 100%; max-height: 72vh; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; object-fit: contain; display: block; }
    .review { display: grid; grid-template-columns: 1fr; gap: 20px; }
    textarea { width: 100%; min-height: 90px; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    button { font: inherit; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; background: transparent; color: inherit; flex: 1; }
    button.approve { background: var(--ok); color: #fff; border-color: var(--ok); }
    button.reject { background: var(--bad); color: #fff; border-color: var(--bad); }
    .error { color: var(--bad); font-weight: 600; margin: 8px 0; }
    .strip { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; margin: 0 0 16px; }
    .strip b { font-weight: 600; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
    .card .big { font-size: 20px; font-weight: 700; }
    .feed { display: grid; gap: 28px; }
    .post .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 0 2px; font-size: 14px; }
    .post p { margin: 4px 0; }
    .novideo { aspect-ratio: 9 / 16; max-height: 40vh; border-radius: 12px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 14px; }
    .timeline td { padding: 3px 8px 3px 0; border: 0; font-size: 13px; }
    .escalation { border: 1px solid var(--warn); border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
    .escalation ul { margin: 6px 0; padding-left: 20px; }
    details { margin-top: 22px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; height: calc(var(--bar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: Canvas; border-top: 1px solid var(--line); }
    nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 11px; position: relative; }
    nav.tabs a.on { color: var(--accent); font-weight: 600; }
    nav.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    @media (min-width: 900px) { main { padding: 28px 16px; } }
  </style>
</head>
<body>
  {% set path = request.url.path %}
  <main>{% block content %}{% endblock %}</main>
  <nav class="tabs" aria-label="Sections">
    <a href="/" class="{{ 'on' if path == '/' or path.startswith('/experiments') }}">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>Videos</a>
    <a href="/review" class="{{ 'on' if path.startswith('/review') }}">
      <svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>Review
</a>
    <a href="/ips" class="{{ 'on' if path.startswith('/ips') }}">
      <svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 19c0-3 2.5-5 5-5s5 2 5 5M14 19c0-2 1.5-3.5 3.5-3.5S21 17 21 19"/></svg>IPs</a>
    <a href="/costs" class="{{ 'on' if path.startswith('/costs') }}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5v1.5M12 16v1.5"/></svg>Spend</a>
    <a href="/decisions" class="{{ 'on' if path.startswith('/decisions') or path.startswith('/queue') }}">
      <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Log</a>
  </nav>
</body>
</html>
