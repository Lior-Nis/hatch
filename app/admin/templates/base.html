<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>{% block title %}Hatch{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --line: #8883; --muted: #6b6b6b; --ok: #1a7f37; --bad: #b42318; --warn: #9a6700; --accent: #6d5dfc; --bar: 60px; }
    @media (prefers-color-scheme: dark) { :root { --muted: #a3a3a3; --line: #8885; --accent: #9d93ff; --ok: #3fb950; --bad: #f47067; --warn: #d4a72c; } }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font: 16px/1.5 system-ui, -apple-system, sans-serif; margin: 0; padding-bottom: calc(var(--bar) + env(safe-area-inset-bottom) + 16px); }
    main { max-width: 680px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 22px; margin: 4px 0 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    h2 { font-size: 13px; margin: 26px 0 8px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
    a { color: var(--accent); text-decoration: none; }
    p a, td a { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    th, td { text-align: left; padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: 12px; }
    code, pre { font: 13px/1.45 ui-monospace, monospace; }
    pre { white-space: pre-wrap; margin: 0; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .tag { display: inline-block; padding: 1px 9px; border-radius: 10px; border: 1px solid var(--line); font-size: 12px; font-weight: 500; white-space: nowrap; }
    .tag.approve, .tag.pass, .tag.good { color: var(--ok); border-color: var(--ok); }
    .tag.reject, .tag.fail { color: var(--bad); border-color: var(--bad); }
    .tag.escalate, .tag.flag { color: var(--warn); border-color: var(--warn); }
    .warn { color: var(--warn); } .bad { color: var(--bad); } .good { color: var(--ok); }
    video { width: 100%; max-height: 72vh; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; object-fit: contain; display: block; }
    .review { display: grid; grid-template-columns: 1fr; gap: 20px; }
    textarea { width: 100%; min-height: 90px; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: inherit; }
    .actions { display: flex; gap: 10px; margin-top: 10px; }
    button { font: inherit; padding: 12px 20px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer; background: transparent; color: inherit; flex: 1; }
    button.approve { background: var(--ok); color: #fff; border-color: var(--ok); }
    button.reject { background: var(--bad); color: #fff; border-color: var(--bad); }
    .error { color: var(--bad); font-weight: 600; margin: 8px 0; }
    .strip { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; margin: 0 0 16px; }
    .strip b { font-weight: 600; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
    .card .big { font-size: 20px; font-weight: 700; }
    .feed { display: grid; gap: 28px; }
    .post .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 10px 0 2px; font-size: 14px; }
    .post p { margin: 4px 0; }
    .novideo { aspect-ratio: 9 / 16; max-height: 40vh; border-radius: 12px; border: 1px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 14px; }
    .timeline td { padding: 3px 8px 3px 0; border: 0; font-size: 13px; }
    .escalation { border: 1px solid var(--warn); border-radius: 12px; padding: 10px 14px; margin: 12px 0; }
    .escalation ul { margin: 6px 0; padding-left: 20px; }
    details { margin-top: 22px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; height: calc(var(--bar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: Canvas; border-top: 1px solid var(--line); }
    nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 12px; position: relative; }
    nav.tabs a.on { color: var(--accent); font-weight: 600; }
    nav.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .flash { position: sticky; top: 0; z-index: 12; margin: -16px -16px 14px; padding: 12px 16px; background: var(--ok); color: #fff; font-weight: 600; }
    .section-title { display: flex; justify-content: space-between; align-items: baseline; }
    a.card { display: block; color: inherit; }
    a.card + a.card { margin-top: 10px; }
    .needs { border: 1px solid var(--warn); border-radius: 12px; padding: 4px 14px 12px; margin-bottom: 22px; }
    .needs h2 { color: var(--warn); margin-top: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px; }
    .chip { display: inline-block; padding: 1px 9px; border-radius: 10px; background: #8882; font-size: 12px; }
    .chip.on { background: #1a7f3722; color: var(--ok); }
    .decide { position: sticky; bottom: calc(var(--bar) + env(safe-area-inset-bottom)); z-index: 5; margin: 18px -16px 0; padding: 12px 16px 14px; background: Canvas; border-top: 1px solid var(--line); box-shadow: 0 -6px 14px #0002; }
    .decide .why { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; }
    .decide .why label { flex: none; }
    .decide .why input { position: absolute; opacity: 0; }
    .decide .why span { display: block; padding: 7px 12px; border: 1px solid var(--line); border-radius: 18px; font-size: 14px; white-space: nowrap; }
    .decide .why input:checked + span { background: var(--bad); border-color: var(--bad); color: #fff; }
    .decide .why input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .decide button { min-height: 46px; width: 100%; flex: none; font-weight: 600; }
    .decide .stack { display: grid; gap: 8px; }
    .decide textarea { min-height: 56px; margin-bottom: 8px; }
    .decide .flagit { background: none; border: 0; color: var(--muted); min-height: 34px; font-weight: 500; text-decoration: underline; }
    .decide summary { margin: 0 0 8px; text-transform: none; letter-spacing: 0; font-size: 14px; }
    .decide details { margin: 0; }
    ul.tree, ul.tree ul { list-style: none; margin: 0; padding-left: 16px; border-left: 2px solid var(--line); }
    ul.tree { padding-left: 0; border: 0; }
    ul.tree li { margin: 8px 0; }
    ul.tree a.node { display: block; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; color: inherit; min-height: 44px; }
    ul.tree a.node.here { border-color: var(--accent); background: #6d5dfc14; }
    ul.tree .rel { font-size: 12px; color: var(--muted); }
    ul.tree .stmt { font-size: 14px; }
    @media (min-width: 900px) { main { padding: 28px 16px; } }
  </style>
</head>
<body>
  {% set path = request.url.path %}
  <main>
    <div id="flash" class="flash" role="status" hidden></div>
    {% block content %}{% endblock %}
  </main>
  <nav class="tabs" aria-label="Sections">
    <a href="/" class="{{ 'on' if path == '/' or path.startswith('/experiments') }}"{% if path == '/' or path.startswith('/experiments') %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/></svg>Videos</a>
    <a href="/review" class="{{ 'on' if path.startswith('/review') }}"{% if path.startswith('/review') %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg>Review
</a>
    <a href="/ips" class="{{ 'on' if path.startswith('/ips') }}"{% if path.startswith('/ips') %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 19c0-3 2.5-5 5-5s5 2 5 5M14 19c0-2 1.5-3.5 3.5-3.5S21 17 21 19"/></svg>IPs</a>
    <a href="/costs" class="{{ 'on' if path.startswith('/costs') }}"{% if path.startswith('/costs') %} aria-current="page"{% endif %}>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6.5v1.5M12 16v1.5"/></svg>Spend</a>
    <a href="/decisions" class="{{ 'on' if path.startswith('/decisions') or path.startswith('/queue') }}">
      <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>Log</a>
  </nav>
  <script>
  (function () {
    var f, tz = "UTC";
    try { f = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
          tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC"; } catch (e) { return; }
    function ago(d) {
      var s = (Date.now() - d.getTime()) / 1000;
      if (s < -60) return f.format(d);
      if (s < 60) return "just now";
      if (s < 3600) return Math.floor(s / 60) + " min ago";
      if (s < 86400) return Math.floor(s / 3600) + " h ago";
      if (s < 604800) return Math.floor(s / 86400) + " d ago";
      return f.format(d);
    }
    document.querySelectorAll("time.t").forEach(function (el) {
      var d = new Date(el.getAttribute("datetime"));
      if (isNaN(d.getTime())) return;
      el.textContent = ago(d);
      el.title = f.format(d) + " (" + tz + ")";
    });
    var m = document.cookie.match(/(?:^|; )flash=([a-z]+)/), box = document.getElementById("flash");
    var words = { approved: "Approved. It posts at the next slot.", rejected: "Rejected.", flagged: "Flagged for later." };
    if (m && box && words[m[1]]) { box.textContent = words[m[1]]; box.hidden = false; setTimeout(function () { box.hidden = true; }, 4000); }
    document.cookie = "flash=; Max-Age=0; path=/";
  })();
  </script>
</body>
</html>
