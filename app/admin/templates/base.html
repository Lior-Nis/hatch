<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hatch{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --line: #8884; --muted: #888; --ok: #1a7f37; --bad: #b42318; }
    * { box-sizing: border-box; }
    body { font: 15px/1.5 system-ui, sans-serif; margin: 0; }
    header { padding: 12px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 24px; align-items: baseline; }
    header a { text-decoration: none; color: inherit; }
    header .brand { font-weight: 700; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px; }
    h1 { font-size: 22px; margin: 0 0 16px; }
    h2 { font-size: 16px; margin: 24px 0 8px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: 13px; }
    code, pre { font: 13px/1.45 ui-monospace, monospace; }
    pre { white-space: pre-wrap; margin: 0; }
    .muted { color: var(--muted); }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--line); font-size: 12px; }
    .tag.approve, .tag.pass { color: var(--ok); border-color: var(--ok); }
    .tag.reject, .tag.fail { color: var(--bad); border-color: var(--bad); }
    .review { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 28px; }
    @media (max-width: 760px) { .review { grid-template-columns: 1fr; } }
    video { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 8px; }
    textarea { width: 100%; min-height: 80px; font: inherit; padding: 8px; }
    .actions { display: flex; gap: 12px; margin-top: 10px; }
    button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--line); cursor: pointer; }
    button.approve { background: var(--ok); color: #fff; border-color: var(--ok); }
    button.reject { background: var(--bad); color: #fff; border-color: var(--bad); }
    .error { color: var(--bad); font-weight: 600; margin: 8px 0; }
  </style>
</head>
<body>
  <header><a class="brand" href="/">Hatch</a><a href="/review">Human review</a></header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
